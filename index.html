<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Redio Life has moved</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📻</text></svg>">
<style>
:root{--bg:#1F2C2A;--card:#3B2414;--text:#F3DC9B;--muted:#CFC6B2;--brass:#D2AA62}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--text);font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{width:min(100%,440px);padding:28px 22px;border-radius:20px;background:var(--card);text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4)}
h1{margin:0 0 10px;font-size:26px;color:var(--brass)}
p{margin:0 0 16px;color:var(--muted)}
a.btn{display:block;margin-top:10px;padding:14px;border-radius:10px;font-weight:700;text-decoration:none;background:var(--brass);color:#2C1B0F}
a.alt{background:transparent;color:var(--text);border:2px solid var(--brass)}
</style>
</head>
<body>
<main>
  <div style="font-size:56px" aria-hidden="true">📻</div>
  <h1>Redio Life has moved</h1>
  <p id="msg">Starlite Radio is now <strong>Redio Life</strong>, with a new address.</p>
  <a class="btn" id="get" href="https://github.com/honwhitehat/redio-life/releases/latest">Download the updated app</a>
  <a class="btn alt" href="https://honwhitehat.github.io/redio-life/">Open Redio Life</a>
</main>
<script src="/starlite-radio/moved.js"></script>
</body>
</html>
